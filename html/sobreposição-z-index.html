<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index</title>
    <link rel="stylesheet" href="../css/z-index.css">

</head>

<body>

    <!--
        A ordem do HTML nem sempre determina
        quem ficará na frente.

        Neste exemplo, quem controla a sobreposição
        é o z-index.
    -->

    <div class="caixa1">
        Caixa 1
    </div>

    <div class="caixa2">
        Caixa 2
    </div>

    <div class="caixa3">
        Caixa 3
    </div>

</body>
</html>
