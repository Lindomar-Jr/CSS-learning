<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Grid - Colunas</title>

<link rel="stylesheet" href="../grid/css/colunas.css">

</head>

<body>

    <h1>CSS Grid - Colunas</h1>

    <h2>1. Três colunas iguais</h2>

    <div class="colunas-iguais">

        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>

    </div>

    <h2>2. Utilizando repeat()</h2>

    <div class="repeat">

        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>

    </div>

    <h2>3. Colunas com largura fixa</h2>

    <div class="colunas-fixas">

        <div class="item">200px</div>
        <div class="item">200px</div>
        <div class="item">200px</div>

    </div>

    <h2>4. Colunas proporcionais</h2>

    <div class="colunas-proporcionais">

        <div class="item">1fr</div>
        <div class="item">2fr</div>
        <div class="item">1fr</div>

    </div>

    <h2>5. Colunas mistas</h2>

    <div class="colunas-mistas">

        <div class="item">250px</div>
        <div class="item">1fr</div>
        <div class="item">2fr</div>

    </div>

</body>
</html>
