<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Grid - Linhas</title>

<link rel="stylesheet" href="../grid/css/linhas.css">

</head>

<body>

    <h1>CSS Grid - Linhas</h1>

    <h2>1. Linhas com alturas fixas</h2>

    <div class="linhas-fixas">

        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>

    </div>

    <h2>2. Utilizando repeat()</h2>

    <div class="repeat">

        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>

    </div>

    <h2>3. Linhas proporcionais</h2>

    <div class="linhas-proporcionais">

        <div class="item">1fr</div>
        <div class="item">1fr</div>
        <div class="item">2fr</div>
        <div class="item">2fr</div>

    </div>

    <h2>4. Linhas mistas</h2>

    <div class="linhas-mistas">

        <div class="item">100px</div>
        <div class="item">100px</div>
        <div class="item">1fr</div>
        <div class="item">1fr</div>

    </div>

    <h2>5. Criação automática de linhas</h2>

    <div class="linhas-automaticas">

        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item">9</div>

    </div>

</body>
</html>
