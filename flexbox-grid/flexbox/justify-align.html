<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamentos no Flexbox</title>

    <link rel="stylesheet" href="../../css/justify-align.css">

</head>

<body>

    <h1>Alinhamentos no Flexbox</h1>



    <h2>1 - Justify Content</h2>

    <p>
        Distribui os elementos horizontalmente (eixo principal).
    </p>

    <div class="container justify">

        <div class="item">1</div>

        <div class="item">2</div>

        <div class="item">3</div>

    </div>





    <h2>2 - Align Items</h2>

    <p>
        Alinha todos os elementos verticalmente (eixo cruzado).
    </p>

    <div class="container align-items">

        <div class="item">1</div>

        <div class="item">2</div>

        <div class="item">3</div>

    </div>





    <h2>3 - Align Content</h2>

    <p>
        Organiza as linhas quando ocorre quebra (wrap).
    </p>

    <div class="container align-content">

        <div class="item">1</div>

        <div class="item">2</div>

        <div class="item">3</div>

        <div class="item">4</div>

        <div class="item">5</div>

        <div class="item">6</div>

        <div class="item">7</div>

        <div class="item">8</div>

    </div>

</body>

</html>
